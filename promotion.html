<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♰ DFUSEME! - DRUM PACK PROMO ♰</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Reset y estilos base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: 'Barlow Condensed', sans-serif;
            position: relative;
            margin: 0 auto;
        }
        
        /* Efectos visuales */
        .glitch-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/logo/loader.webp') no-repeat center center;
            background-size: cover;
            opacity: 0.02;
            z-index: 0;
            animation: glitch-anim 5s infinite linear;
        }
        
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(255,255,255,0.03) 50%, 
                rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }
        
        /* Animaciones */
        @keyframes glitch-anim {
            0% { transform: translate(0); opacity: 0.02; }
            20% { transform: translate(-5px, 5px); opacity: 0.04; }
            40% { transform: translate(-5px, -5px); opacity: 0.02; }
            60% { transform: translate(5px, 5px); opacity: 0.06; }
            80% { transform: translate(5px, -5px); opacity: 0.02; }
            100% { transform: translate(0); opacity: 0.03; }
        }
        
        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 10px #ff0055; }
            50% { text-shadow: 0 0 20px #ff4d88; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        /* Contenido principal */
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 80px 60px;
        }
        
        .header {
            text-align: center;
            z-index: 2;
            animation: fadeIn 1s ease-out;
        }
        
        .logo {
            width: 200px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 10px #ff0055);
            animation: pulse 2s infinite;
        }
        
        .title {
            font-size: 5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            color: #ff0055;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
            font-family: 'Orbitron', sans-serif;
            animation: pulse 2s infinite;
        }
        
        .subtitle {
            font-size: 2.5rem;
            letter-spacing: 3px;
            margin-bottom: 40px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .drum-pack-cover {
            width: 600px;
            height: 600px;
            margin: 0 auto;
            border-radius: 20px;
            border: 3px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
            position: relative;
            overflow: hidden;
            animation: float 6s ease-in-out infinite;
            z-index: 2;
        }
        
        .drum-pack-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 40px 0;
            z-index: 2;
        }
        
        .feature-item {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid rgba(255, 0, 85, 0.3);
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            min-width: 200px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        
        .feature-item:hover {
            transform: scale(1.05);
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }
        
        .feature-number {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ff0055;
            line-height: 1;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
        }
        
        .feature-text {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .cta-button {
            display: inline-block;
            padding: 25px 50px;
            background: linear-gradient(45deg, #ff0055, #ff3385);
            color: white;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: none;
            border-radius: 50px;
            margin: 40px auto;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.5);
            z-index: 2;
            animation: pulse 2s infinite;
        }
        
        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 0, 85, 0.7);
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 1.5rem;
            letter-spacing: 2px;
            z-index: 2;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }
        
        .social-icons a {
            color: white;
            font-size: 2.5rem;
            transition: all 0.3s ease;
        }
        
        .social-icons a:hover {
            color: #ff0055;
            transform: scale(1.2);
        }
        
        /* Animaciones de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1s; }
        .delay-3 { animation-delay: 1.5s; }
        .delay-4 { animation-delay: 2s; }
        
        /* Efecto de audio visualizador */
        .audio-visualizer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 2px;
            z-index: 1;
        }
        
        .bar {
            width: 8px;
            background: linear-gradient(to top, #ff0055, #ff3385);
            border-radius: 5px 5px 0 0;
            animation: equalizer 1.5s infinite ease-in-out;
        }
        
        @keyframes equalizer {
            0%, 100% { height: 10%; }
            50% { height: 90%; }
        }
        
        .bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
        .bar:nth-child(2) { animation-delay: 0.3s; height: 60%; }
        .bar:nth-child(3) { animation-delay: 0.5s; height: 40%; }
        .bar:nth-child(4) { animation-delay: 0.2s; height: 70%; }
        .bar:nth-child(5) { animation-delay: 0.4s; height: 50%; }
        .bar:nth-child(6) { animation-delay: 0.6s; height: 80%; }
        .bar:nth-child(7) { animation-delay: 0.3s; height: 30%; }
        .bar:nth-child(8) { animation-delay: 0.5s; height: 60%; }
        .bar:nth-child(9) { animation-delay: 0.7s; height: 40%; }
        .bar:nth-child(10) { animation-delay: 0.4s; height: 70%; }
    </style>
</head>
<body>
    <!-- Efectos de fondo -->
    <div class="glitch-effect"></div>
    <div class="scanlines"></div>
    
    <!-- Contenedor principal del video -->
    <div class="video-container">
        <!-- Encabezado -->
        <div class="header">
            <img src="assets/images/logo/loader.webp" alt="DFUSEME Logo" class="logo">
            <h1 class="title">DFVAULT001</h1>
            <h2 class="subtitle">FREE DRUM PACK</h2>
        </div>
        
        <!-- Imagen del drum pack -->
        <div class="drum-pack-cover">
            <img src="assets/images/favicon/favicon.webp" alt="DFVAULT001 Drum Pack">
        </div>
        
        <!-- Características -->
        <div class="features">
            <div class="feature-item animated fadeIn delay-1">
                <div class="feature-number">50</div>
                <div class="feature-text">FILES</div>
            </div>
            <div class="feature-item animated fadeIn delay-2">
                <div class="feature-number">5</div>
                <div class="feature-text">KICKS</div>
            </div>
            <div class="feature-item animated fadeIn delay-3">
                <div class="feature-number">10</div>
                <div class="feature-text">HATS</div>
            </div>
            <div class="feature-item animated fadeIn delay-4">
                <div class="feature-number">10</div>
                <div class="feature-text">PRESETS</div>
            </div>
        </div>
        
        <!-- Botón CTA -->
        <a href="drumpacks.html" class="cta-button animated fadeIn delay-3">
            DOWNLOAD NOW
        </a>
        
        <!-- Footer -->
        <div class="footer animated fadeIn delay-4">
            <p>@DFUSEME_TECHNO</p>
            <div class="social-icons">
                <a href="https://www.instagram.com/dfuseme_techno/" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@dfuseme_official" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://soundcloud.com/" target="_blank"><i class="fab fa-soundcloud"></i></a>
                <a href="https://x.com/dfuseme" target="_blank"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
        
        <!-- Visualizador de audio (efecto) -->
        <div class="audio-visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>
    
    <script>
        // Efecto de carga inicial
        document.addEventListener('DOMContentLoaded', function() {
            // Simular reproducción de audio con el visualizador
            const bars = document.querySelectorAll('.bar');
            
            function animateBars() {
                bars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 80) + 10;
                    bar.style.height = `${randomHeight}%`;
                });
                
                requestAnimationFrame(animateBars);
            }
            
            // Iniciar animación
            setTimeout(animateBars, 500);
            
            // Efecto de parpadeo aleatorio (glitch)
            function randomGlitch() {
                const glitch = document.querySelector('.glitch-effect');
                const intensity = Math.random() * 0.1;
                glitch.style.opacity = intensity;
                
                setTimeout(randomGlitch, Math.random() * 3000 + 1000);
            }
            
            randomGlitch();
            
            // Animación de elementos al aparecer
            const animatedElements = document.querySelectorAll('.animated');
            
            animatedElements.forEach(el => {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, parseFloat(getComputedStyle(el).animationDelay) * 1000);
            });
        });
    </script>
</body>
</html>
